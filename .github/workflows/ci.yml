name: Validate Falcon Fuel

on:
  pull_request:
  push:
    branches:
      - main
      - phase8-tracking-plan-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint-output.txt
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint-output.txt

      - name: Build
        run: npm run build

      - name: Validate dining data
        run: npm run validate:data
