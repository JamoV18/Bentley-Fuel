name: Fix DineOn rollover compatibility

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-dineon-aug30.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply DineOn rollover patch
        run: python scripts/fix_dineon_aug30.py

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Commit DineOn rollover fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/dineOnCampusProvider.ts src/services/dineOnCampusServerFetch.ts
          git commit -m "Harden live DineOn menu rollover handling"
          git push origin main
