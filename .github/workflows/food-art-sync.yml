name: Sync Falcon Food Art

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: falcon-food-art
  cancel-in-progress: false

jobs:
  sync-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FALCON_APP_URL: ${{ secrets.FALCON_APP_URL }}
      FALCON_ART_CRON_SECRET: ${{ secrets.FALCON_ART_CRON_SECRET }}
    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$FALCON_APP_URL" || -z "$FALCON_ART_CRON_SECRET" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Food Art automation is dormant until FALCON_APP_URL and FALCON_ART_CRON_SECRET are configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff DineOnCampus menus into the art registry
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 --retry-all-errors \
            -X POST "${FALCON_APP_URL%/}/api/food-art/sync" \
            -H "Authorization: Bearer $FALCON_ART_CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"daysBack":0,"daysForward":7}'

      - name: Drain a bounded generation batch
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for iteration in 1 2 3; do
            response=$(curl --fail-with-body --retry 2 --retry-all-errors \
              -X POST "${FALCON_APP_URL%/}/api/food-art/work" \
              -H "Authorization: Bearer $FALCON_ART_CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"limit":3}')
            echo "$response"
            claimed=$(echo "$response" | jq -r '.claimed // 0')
            if [[ "$claimed" == "0" ]]; then
              break
            fi
          done

      - name: Report Food Art queue health
        if: always() && steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set +e
          response=$(curl --silent --show-error --fail-with-body \
            "${FALCON_APP_URL%/}/api/food-art/status" \
            -H "Authorization: Bearer $FALCON_ART_CRON_SECRET")
          status=$?
          if [[ $status -ne 0 ]]; then
            echo "::warning::Could not read Falcon Food Art operational status after this run."
            exit 0
          fi

          echo "$response" | jq '{items, operations}'
          failed=$(echo "$response" | jq -r '.operations.jobCounts.failed // 0')
          open_reviews=$(echo "$response" | jq -r '.operations.reviewCounts.open // 0')
          stale=$(echo "$response" | jq -r '.operations.staleRunningJobs // 0')
          oldest=$(echo "$response" | jq -r '.operations.oldestQueuedAgeSeconds // 0')

          if [[ "$failed" -gt 0 ]]; then
            echo "::warning::$failed Falcon Food Art queue job(s) are in terminal failure."
          fi
          if [[ "$open_reviews" -gt 0 ]]; then
            echo "::warning::$open_reviews QA-rejected Falcon Food Art candidate(s) are waiting for private operator review."
          fi
          if [[ "$stale" -gt 0 ]]; then
            echo "::warning::$stale Falcon Food Art job(s) still hold stale worker locks."
          fi
          if [[ "$oldest" -gt 21600 ]]; then
            echo "::warning::The oldest queued Falcon Food Art job has waited more than six hours."
          fi
