name: Harden DineOn reliability

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/harden-dineon-reliability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply reliability patch
        run: python scripts/harden_dineon_reliability.py

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Commit reliability hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/dineOnCampusProvider.ts src/services/dineOnCampusProvider.test.ts
          git commit -m "Harden daily DineOn menu reliability"
          git push origin main
