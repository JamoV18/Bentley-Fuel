name: Roll out recommendation quality v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recommendation-v2.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Tune recommendation v2 patch inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          quality = Path("src/services/recommendationMealQuality.ts")
          text = quality.read_text()
          text = text.replace(
              'if (sideItems.length >= 2 && denseCount >= 2) score -= 18;',
              'if (sideItems.length >= 2 && denseCount >= 2) score -= 28;',
          )
          text = text.replace(
              'if (sideItems.length >= 2 && produceCount === 0) score -= 8;',
              'if (sideItems.length >= 2 && produceCount === 0) score -= 12;',
          )
          text = text.replace(
              'if (style === "handheld" && sideItems.length >= 2 && denseCount >= 2) score -= 10;',
              'if (style === "handheld" && sideItems.length >= 2 && denseCount >= 2) score -= 14;',
          )
          quality.write_text(text)

          patch = Path("scripts/recommendation_v2_patch.py")
          text = patch.read_text()
          old = 'const builds = cartesian(variantGroups, distinctAnchorCount > 1 ? Math.min(2, remaining) : remaining);'
          new = '''const isSingleCustomizable = itemSet.length === 1 && itemSet[0]?.kind === "customizable";
    const perSetCap = distinctAnchorCount > 1 && !isSingleCustomizable
      ? Math.min(2, remaining)
      : Math.min(maxCustomVariants, remaining);
    const builds = cartesian(variantGroups, perSetCap);'''
          if old not in text:
              raise SystemExit("candidate variant cap patch target missing")
          patch.write_text(text.replace(old, new, 1))
          PY

      - name: Apply recommendation v2 patch
        run: python scripts/recommendation_v2_patch.py

      - name: Validate recommendation v2
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit recommendation v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/recommendationMealQuality.ts src/services/recommendationCandidates.ts src/services/recommendationCandidates.test.ts src/services/recommendationScoring.ts src/services/recommendationMealQuality.test.ts 'src/app/meal-builder/[locationId]/MealBuilderClient.tsx'
          git commit -m "Improve recommendation meal quality and variety"
          git push origin HEAD:main
