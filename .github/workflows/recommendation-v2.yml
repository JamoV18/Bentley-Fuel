name: Roll out recommendation quality v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recommendation-v2.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Tune recommendation v2 patch inputs
        run: python scripts/recommendation_v2_fix_inputs.py

      - name: Apply recommendation v2 patch
        run: python scripts/recommendation_v2_patch.py

      - name: Validate recommendation v2
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit recommendation v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/recommendationMealQuality.ts src/services/recommendationCandidates.ts src/services/recommendationCandidates.test.ts src/services/recommendationScoring.ts src/services/recommendationMealQuality.test.ts 'src/app/meal-builder/[locationId]/MealBuilderClient.tsx'
          git commit -m "Improve recommendation meal quality and variety"
          git push origin HEAD:main

# Retry after tuning coherence validation.
