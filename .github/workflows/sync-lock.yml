name: Sync dependency lockfile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git commit -m "Sync Motion dependency lockfile"
          git push origin HEAD:main
